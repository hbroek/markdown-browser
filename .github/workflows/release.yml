name: release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-latest
            name: linux-amd64
            tags: -tags webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      # Build first: it creates frontend/dist, which main.go embeds.
      - run: wails build ${{ matrix.tags }}
      - run: go vet ./...
      - run: go test ./...

      # Needs these repository secrets (see README, "Signing releases"):
      #   MACOS_CERT_P12, MACOS_CERT_PASSWORD  Developer ID Application cert, base64 .p12
      #   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID  for notarytool
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=build/bin/markdown-browser.app
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

          security delete-keychain "$KEYCHAIN"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --keepParent build/bin/markdown-browser.app "dist/markdown-browser-${{ github.ref_name }}-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/bin/markdown-browser.exe -DestinationPath "dist/markdown-browser-${{ github.ref_name }}-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/markdown-browser-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C build/bin markdown-browser

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "macOS builds are signed and notarized. Windows builds are unsigned: choose More info, then Run anyway."
