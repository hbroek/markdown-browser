name: release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-latest
            name: linux-amd64
            tags: -tags webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      # Build first: it creates frontend/dist, which main.go embeds.
      - run: wails build ${{ matrix.tags }}
      - run: go vet ./...
      - run: go test ./...

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --keepParent build/bin/markdown-browser.app "dist/markdown-browser-${{ github.ref_name }}-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/bin/markdown-browser.exe -DestinationPath "dist/markdown-browser-${{ github.ref_name }}-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/markdown-browser-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C build/bin markdown-browser

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Unsigned builds: on macOS right-click the app and choose Open; on Windows choose More info, then Run anyway."
